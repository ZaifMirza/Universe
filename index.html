<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cosmos</title>
  <meta name="description" content="A scroll-driven flight through a galaxy, a nebula, a star, a ringed giant and a black hole — rendered live in WebGL.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6' fill='%23ffc58f'/%3E%3Cellipse cx='16' cy='16' rx='14' ry='5' fill='none' stroke='%23ffc58f' stroke-width='1.5'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #010208;
  --ink: #f3efe8;
  --muted: rgba(243, 239, 232, 0.5);
  --warm: #ffc58f;
  --serif: "Instrument Serif", Georgia, serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  --gutter: clamp(16px, 4vw, 56px);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--mono);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

::selection { background: var(--warm); color: #000; }

#scene {
  position: fixed; inset: 0;
  width: 100vw; height: 100vh;
  display: block;
}

.track { height: 3400vh; }

/* ---------- Loader ---------- */
#loader {
  position: fixed; inset: 0; z-index: 20;
  background: var(--bg);
  display: grid; place-items: center;
  transition: opacity 2.4s ease, visibility 2.4s;
}
#loader span {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--warm);
  box-shadow: 0 0 24px 6px rgba(255, 197, 143, 0.6);
  animation: breathe 1.6s ease-in-out infinite;
}
#loader.done { opacity: 0; visibility: hidden; }
@keyframes breathe { 50% { transform: scale(2.2); opacity: .5; } }

/* ---------- HUD ---------- */
.hud {
  position: fixed; left: 0; right: 0; z-index: 5;
  display: flex; justify-content: space-between; align-items: center;
  padding: 24px var(--gutter);
  font-size: 10px; letter-spacing: 0.4em; color: var(--muted);
  pointer-events: none;
  opacity: 0; transition: opacity 2s ease 1.2s;
}
.hud-top { top: 0; }
body.ready .hud { opacity: 1; }
.brand { color: var(--ink); }
.hud-right { display: flex; align-items: center; gap: 28px; }
.sound {
  pointer-events: auto; cursor: pointer;
  appearance: none; border: 0; background: none; color: var(--muted);
  display: flex; align-items: flex-end; gap: 2px; height: 14px; padding: 0;
  font: 10px var(--mono); letter-spacing: 0.4em;
  transition: color .3s;
}
.sound span { margin-left: 10px; line-height: 1; }
.sound i { width: 2px; height: 3px; background: currentColor; border-radius: 1px; transition: height .3s; }
.sound:hover, .sound.on { color: var(--ink); }
.sound.on i { animation: eq 1.2s ease-in-out infinite; }
.sound.on i:nth-child(2) { animation-delay: -.3s; }
.sound.on i:nth-child(3) { animation-delay: -.6s; }
.sound.on i:nth-child(4) { animation-delay: -.9s; }
.play {
  pointer-events: auto; cursor: pointer;
  appearance: none; border: 0; background: none; color: var(--muted);
  display: flex; align-items: center; gap: 10px; height: 14px; padding: 0;
  font: 10px var(--mono); letter-spacing: 0.4em;
  transition: color .3s;
}
.play i {
  width: 0; height: 0;
  border-style: solid; border-width: 5px 0 5px 8px;
  border-color: transparent transparent transparent currentColor;
  transition: border-width .25s;
}
/* Pause icon: two bars. */
.play.on i { width: 8px; height: 10px; border-width: 0 3px; border-color: currentColor; box-sizing: border-box; }
.play:hover, .play.on { color: var(--ink); }
.play:focus-visible { outline: 1px solid var(--warm); outline-offset: 4px; }
.sound:focus-visible { outline: 1px solid var(--warm); outline-offset: 4px; }
@keyframes eq { 0%, 100% { height: 3px; } 50% { height: 12px; } }
.readout { letter-spacing: 0.2em; font-variant-numeric: tabular-nums; }

/* ---------- Chapters ---------- */
.chapters { position: fixed; inset: 0; z-index: 4; pointer-events: none; }
.chapter {
  position: absolute;
  left: var(--gutter); bottom: clamp(48px, 12vh, 120px);
  max-width: min(90vw, 900px);
  opacity: 0; visibility: hidden;
  will-change: opacity, transform, filter;
}
.chapter .num {
  display: block;
  font-family: var(--serif); font-size: 18px; color: var(--warm);
  margin-bottom: 4px;
}
.chapter h1 {
  margin: 0;
  font-family: var(--serif); font-weight: 400; font-style: italic;
  font-size: clamp(64px, 12vw, 190px); line-height: 0.9; letter-spacing: -0.02em;
  perspective: 600px;
}
/* Letters arrive one after another as the chapter comes into focus. */
.chapter h1 .ch {
  --le: clamp(0, calc(var(--e, 0) * 2.4 - var(--i) * 0.11), 1);
  display: inline-block;
  padding-right: 0.06em; margin-right: -0.06em;
  background: linear-gradient(180deg, #fff 20%, rgba(255, 220, 190, 0.55));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  text-shadow: 0 0 60px rgba(255, 190, 140, 0.15);
  opacity: var(--le);
  transform: translate3d(0, calc((1 - var(--le)) * var(--dir, 1) * 0.45em), 0) rotateX(calc((1 - var(--le)) * var(--dir, 1) * -70deg));
  filter: blur(calc((1 - var(--le)) * 12px));
  transform-origin: 50% 100%;
  will-change: transform, opacity, filter;
}
.chapter .num, .chapter p {
  opacity: clamp(0, calc(var(--e, 0) * 2 - 0.6), 1);
  transform: translate3d(0, calc((1 - var(--e, 0)) * 14px), 0);
}
.chapter p {
  margin: 18px 0 0 6px;
  font-size: 11px; text-transform: uppercase; color: var(--muted);
  letter-spacing: calc(0.45em + (1 - var(--e, 0)) * 0.5em);
}
.chapter.minor h1 { font-size: clamp(48px, 8vw, 128px); }
.chapter.minor p { margin-top: 12px; }
.chapter.hero {
  left: 0; right: 0; bottom: auto; top: 50%;
  max-width: none; text-align: center;
  margin-top: -0.5em;
}
.chapter.hero h1 { font-size: clamp(80px, 19vw, 300px); }
.chapter.hero p { margin-left: 0; }

/* ---------- Chapter dots ---------- */
.dots {
  position: fixed; right: var(--gutter); top: 50%; transform: translateY(-50%); z-index: 6;
  display: flex; flex-direction: column; gap: 6px;
  opacity: 0; transition: opacity 2s ease 1.6s;
}
body.ready .dots { opacity: 1; }
.dots button {
  appearance: none; border: 0; background: none; cursor: pointer;
  padding: 8px 0; display: flex; align-items: center; justify-content: flex-end; gap: 14px;
  color: var(--muted); font: 10px var(--mono); letter-spacing: 0.3em; text-transform: uppercase;
}
.dots button::after {
  content: ""; width: 14px; height: 1px; background: currentColor;
  transition: width .5s cubic-bezier(.2, .8, .2, 1), background .5s;
}
.dots button span { opacity: 0; transform: translateX(8px); transition: opacity .4s, transform .4s; }
.dots button:hover span, .dots button.on span { opacity: 1; transform: none; }
.dots button.on { color: var(--ink); }
.dots button.on::after { width: 36px; background: var(--warm); }
.dots button:focus-visible { outline: 1px solid var(--warm); outline-offset: 4px; }

/* ---------- Scroll hint ---------- */
.hint {
  position: fixed; left: 50%; bottom: 32px; z-index: 5; transform: translateX(-50%);
  width: 1px; height: 56px; background: rgba(255, 255, 255, 0.12); overflow: hidden;
  pointer-events: none;
}
.hint i {
  position: absolute; left: 0; top: -40%; width: 100%; height: 40%;
  background: linear-gradient(transparent, var(--warm));
  animation: drip 2.2s cubic-bezier(.6, 0, .4, 1) infinite;
}
@keyframes drip { to { top: 100%; } }

/* ---------- Solar-system tour bar ---------- */
.tourbar {
  position: fixed; left: 50%; bottom: 26px; z-index: 6;
  transform: translate(-50%, 12px);
  display: flex; gap: 4px; padding: 6px 8px;
  border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 999px;
  background: rgba(4, 6, 18, 0.45); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  opacity: 0; pointer-events: none;
  transition: opacity .6s ease, transform .6s ease;
}
.tourbar.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
.tourbar button {
  appearance: none; border: 0; background: none; cursor: pointer;
  display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 999px;
  color: var(--muted); font: 9px var(--mono); letter-spacing: 0.18em; text-transform: uppercase;
  transition: color .3s, background .3s;
}
.tourbar button i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; transition: transform .3s, background .3s; }
.tourbar button span { max-width: 0; overflow: hidden; white-space: nowrap; transition: max-width .45s cubic-bezier(.2, .8, .2, 1); }
.tourbar button:hover span, .tourbar button.on span { max-width: 90px; }
.tourbar button.on { color: var(--ink); background: rgba(255, 197, 143, 0.12); }
.tourbar button.on i { background: var(--warm); transform: scale(1.5); box-shadow: 0 0 10px var(--warm); }
.tourbar button:focus-visible { outline: 1px solid var(--warm); }

/* ---------- Galaxy-collision playback ---------- */
.sim {
  position: fixed; left: 50%; bottom: 26px; z-index: 6;
  transform: translate(-50%, 12px);
  display: flex; align-items: center; gap: 10px; padding: 8px 12px;
  width: min(560px, calc(100vw - 32px)); box-sizing: border-box;
  border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 999px;
  background: rgba(4, 6, 18, 0.5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  color: var(--muted); font: 9px var(--mono); letter-spacing: 0.18em; text-transform: uppercase;
  opacity: 0; pointer-events: none;
  transition: opacity .6s ease, transform .6s ease;
}
.sim.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
.sim button {
  appearance: none; border: 0; background: none; cursor: pointer; color: inherit; font: inherit; letter-spacing: inherit;
  transition: color .3s, background .3s;
}
.sim button:hover { color: var(--ink); }
.sim button:focus-visible { outline: 1px solid var(--warm); }
.sim-btn {
  flex: none; width: 28px; height: 28px; border-radius: 50%;
  display: grid; place-items: center; font-size: 14px !important; letter-spacing: 0 !important;
  background: rgba(255, 255, 255, 0.05) !important;
}
.ico-play { width: 0; height: 0; border-style: solid; border-width: 5px 0 5px 8px; border-color: transparent transparent transparent currentColor; margin-left: 2px; }
.ico-pause { width: 8px; height: 10px; border-left: 3px solid currentColor; border-right: 3px solid currentColor; box-sizing: border-box; }
.sim-mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.sim-label { display: flex; justify-content: space-between; gap: 8px; white-space: nowrap; }
.sim-phase { color: var(--ink); }
.sim-time { color: var(--warm); }
.sim-track { position: relative; height: 2px; background: rgba(255, 255, 255, 0.12); border-radius: 2px; }
.sim-fill { position: absolute; inset: 0 auto 0 0; background: var(--warm); border-radius: 2px; box-shadow: 0 0 8px var(--warm); }
.sim-track i { position: absolute; top: -2px; width: 1px; height: 6px; background: rgba(255, 255, 255, 0.35); }
.sim-speed { flex: none; display: flex; gap: 2px; }
.sim-speed button { padding: 5px 6px; border-radius: 999px; }
.sim-speed button.on { color: var(--ink); background: rgba(255, 197, 143, 0.12); }

@media (max-width: 700px) {
  .tourbar { bottom: 14px; max-width: calc(100vw - 32px); }
  .tourbar button { padding: 6px 5px; }
  .tourbar button:hover span { max-width: 0; }
  .dots button span { display: none; }
  .readout { display: none; }
  .sim { bottom: 14px; gap: 6px; padding: 6px 8px; }
  .sim-speed button { padding: 5px 3px; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .hint i, #loader span { animation: none; }
}

/* ---------- Auto-play: movie mode ---------- */
/* While the journey plays itself, only the scenery remains: names and controls fade away. */
.chapters, .readout { transition: opacity 1.2s ease; }
body.autoplay .chapters,
body.autoplay .dots,
body.autoplay .tourbar,
body.autoplay .hint,
body.autoplay .sim,
body.autoplay .readout {
  opacity: 0 !important;
  pointer-events: none !important;
}

<body>
  <div id="loader"><span></span></div>
  <canvas id="scene"></canvas>

  <header class="hud hud-top">
    <span class="brand">COSMOS</span>
    <span class="hud-right">
      <span class="readout" id="readout">93 BILLION LY</span>
      <button class="play" id="play" aria-pressed="false" aria-label="Auto-play the journey (P)"><i></i><span>PLAY</span></button>
      <button class="sound" id="sound" aria-pressed="false" aria-label="Toggle ambient sound"><i></i><i></i><i></i><i></i><span>SOUND</span></button>
    </span>
  </header>

  <div class="chapters" id="chapters"></div>
  <nav class="dots" id="dots" aria-label="Chapters"></nav>
  <nav class="tourbar" id="tourbar" aria-label="Solar system tour"></nav>
  <div class="sim" id="sim" role="group" aria-label="Galaxy collision playback"></div>

  <div class="hint" id="hint"><i></i></div>

  <div class="track" aria-hidden="true"></div>

  <script type="module">
import * as THREE from "three";
// ========== main.js ==========
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

// ========== objects/stars.js ==========
var pointVertex = (
  /* glsl */
  `
  uniform float uTime;
  uniform float uSize;
  uniform float uPR;
  uniform float uMax;
  uniform float uClear;
  uniform float uNear;
  attribute float aScale;
  attribute float aRand;
  varying vec3 vColor;
  void main() {
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    gl_Position = projectionMatrix * mv;
    float twinkle = 0.75 + 0.25 * sin(uTime * (0.6 + aRand * 2.4) + aRand * 60.0);
    gl_PointSize = min(uSize * aScale * uPR * twinkle / -mv.z, uMax * uPR);
    // Optionally clear a cavity around the local origin (used when diving to the core).
    vColor = color * (uClear > 0.0 ? smoothstep(uClear * 0.45, uClear, length(position)) : 1.0);
    // Fade stars that brush past the camera, so flying inside a galaxy stays clean.
    vColor *= uNear > 0.0 ? smoothstep(uNear * 0.25, uNear, -mv.z) : 1.0;
  }
`
);
var pointFragment = (
  /* glsl */
  `
  uniform float uIntensity;
  varying vec3 vColor;
  void main() {
    float d = length(gl_PointCoord - 0.5);
    float s = pow(max(1.0 - d * 2.0, 0.0), 3.0);
    gl_FragColor = vec4(vColor * s * uIntensity, 1.0);
  }
`
);
function pointsMaterial(size, pr2, max = 28, intensity = 1) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uSize: { value: size },
      uPR: { value: pr2 },
      uMax: { value: max },
      uIntensity: { value: intensity },
      uClear: { value: 0 },
      uNear: { value: 0 }
    },
    vertexShader: pointVertex,
    fragmentShader: pointFragment,
    vertexColors: true,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
}
function pointsGeometry(pos, col, scale, rand) {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
  geo.setAttribute("aScale", new THREE.BufferAttribute(scale, 1));
  geo.setAttribute("aRand", new THREE.BufferAttribute(rand, 1));
  return geo;
}
function glowTexture(size = 256, stops = [[0, 1], [0.2, 0.45], [0.5, 0.1], [1, 0]]) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d");
  const h = size / 2;
  const grad = g.createRadialGradient(h, h, 0, h, h, h);
  for (const [o, a] of stops) grad.addColorStop(o, `rgba(255,255,255,${a})`);
  g.fillStyle = grad;
  g.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
function flareTexture() {
  const s = 256;
  const c = document.createElement("canvas");
  c.width = c.height = s;
  const g = c.getContext("2d");
  const grad = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  grad.addColorStop(0, "rgba(255,255,255,1)");
  grad.addColorStop(0.08, "rgba(255,255,255,0.6)");
  grad.addColorStop(0.3, "rgba(255,255,255,0.08)");
  grad.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = grad;
  g.fillRect(0, 0, s, s);
  g.globalCompositeOperation = "lighter";
  for (const [w, h] of [[s, 3], [3, s]]) {
    const lg = w > h ? g.createLinearGradient(0, 0, s, 0) : g.createLinearGradient(0, 0, 0, s);
    lg.addColorStop(0, "rgba(255,255,255,0)");
    lg.addColorStop(0.5, "rgba(255,255,255,0.9)");
    lg.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = lg;
    g.fillRect((s - w) / 2, (s - h) / 2, w, h);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
var MILKY_WAY = {
  branches: 4,
  spin: 1.15,
  randomness: 0.34,
  hazeRate: 0.2,
  pinkRate: 0.035,
  inside: "#ffb27a",
  outside: "#3b5bff",
  core: "#ffc58f",
  clouds: ["#5a3cff", "#ff3f9e", "#2f7bff", "#9b4dff", "#ff7a45"]
};
function createGalaxy({ count, pr: pr2, scale = 10, look = {}, spinRate = 0.02, near = 0, maxPx = 22 }) {
  const L = { ...MILKY_WAY, ...look };
  const P = { radius: 6, branches: L.branches, spin: L.spin, randomness: L.randomness, power: 3 };
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const sc = new Float32Array(count);
  const rand = new Float32Array(count);
  const inside = new THREE.Color(L.inside);
  const outside = new THREE.Color(L.outside);
  const pink = new THREE.Color("#ff4fa8");
  const white = new THREE.Color("#f4f1ff");
  const c = new THREE.Color();
  const dir = new THREE.Vector3();
  const jitter = (r) => dir.randomDirection().multiplyScalar(Math.pow(Math.random(), P.power * 0.7) * P.randomness * (r + 0.4) * 1.6);
  for (let i = 0; i < count; i++) {
    const r = Math.pow(Math.random(), 1.5) * P.radius;
    const haze = Math.random() < L.hazeRate;
    const branch = haze ? Math.random() * Math.PI * 2 : i % P.branches / P.branches * Math.PI * 2;
    const angle = branch + r * P.spin;
    const bulge = 1 + 3.2 * Math.exp(-r * 1.4);
    const j = jitter(r);
    const spread = haze ? 2.5 : 1;
    pos[i * 3] = (Math.cos(angle) * r + j.x * spread) * scale;
    pos[i * 3 + 1] = j.y * 0.32 * bulge * scale;
    pos[i * 3 + 2] = (Math.sin(angle) * r + j.z * spread) * scale;
    c.copy(inside).lerp(outside, Math.min(1, r / P.radius * 1.15));
    const roll = Math.random();
    if (!haze && r > 1.4 && roll < L.pinkRate) c.copy(pink);
    else if (roll > 0.95) c.copy(white);
    if (haze) c.multiplyScalar(0.15);
    col.set([c.r, c.g, c.b], i * 3);
    sc[i] = Math.random() * (roll < 0.035 ? 2.2 : 1);
    rand[i] = Math.random();
  }
  const group = new THREE.Group();
  const disk = new THREE.Group();
  group.add(disk);
  const points2 = new THREE.Points(pointsGeometry(pos, col, sc, rand), pointsMaterial(24 * scale, pr2, maxPx));
  points2.material.uniforms.uNear.value = near;
  points2.frustumCulled = false;
  disk.add(points2);
  const tex = glowTexture();
  const core = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex,
    color: new THREE.Color(L.core).multiplyScalar(1.4),
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  }));
  core.scale.setScalar(2.2 * scale);
  disk.add(core);
  const colors = L.clouds;
  for (let i = 0; i < 26; i++) {
    const r = 1.2 + Math.random() * 4.5;
    const a = i % P.branches / P.branches * Math.PI * 2 + r * P.spin + (Math.random() - 0.5) * 0.5;
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map: tex,
      color: colors[i % colors.length],
      transparent: true,
      opacity: 0.035 + Math.random() * 0.05,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    }));
    s.position.set(Math.cos(a) * r * scale, (Math.random() - 0.5) * 0.2 * scale, Math.sin(a) * r * scale);
    s.scale.setScalar((1.4 + Math.random() * 2.4) * scale);
    disk.add(s);
  }
  return {
    group,
    disk,
    update(t2, camDist = Infinity) {

var RING_DENSITY = (
  /* glsl */
  `
  float ringDensity(float x) {

    d *= smoothstep(0.0, 0.04, x) * smoothstep(1.0, 0.92, x);
    d *= 1.0 - 0.94 * smoothstep(0.6, 0.615, x) * (1.0 - smoothstep(0.655, 0.67, x));
    d *= 1.0 - 0.7 * smoothstep(0.86, 0.865, x) * (1.0 - smoothstep(0.875, 0.88, x));
    d *= mix(0.35, 1.0, smoothstep(0.08, 0.3, x));
    return clamp(d, 0.0, 1.0);
  }

  /* glsl */

  varying vec3 vWorld;
  varying vec3 vN;

  uniform vec3 uRingN;

  varying vec3 vWorld;
  varying vec3 vN;

  ${RING_DENSITY}
  void main() {

    float swirl = snoise(p * 9.0 + w * 2.0);

    c = mix(c, vec3(0.72, 0.5, 0.3), b2 * 0.4);

var ringVertex = (
  /* glsl */

  varying float vR;
  void main() {
    vR = length(position.xy);

    gl_Position = projectionMatrix * viewMatrix * w;
  }
`
);
var ringFragment = (
  /* glsl */

  uniform vec3 uCenter;
  uniform vec3 uRingN;

  varying float vR;
  ${NOISE}

function createAsteroids({ center, count = 2200, inner = 62, outer = 98 }) {
  const group = new THREE.Group();
  group.position.copy(center);
  group.rotation.set(0.12, 0, -0.06);
  const material = new THREE.MeshStandardMaterial({ color: "#ffffff", roughness: 0.95, metalness: 0.05, flatShading: true });
  const variants = [rockGeometry(0.7, 1), rockGeometry(2.9, 1), rockGeometry(5.3, 2)];
  const per = Math.ceil(count / variants.length);
  const m = new THREE.Matrix4();
  const q = new THREE.Quaternion();
  const e = new THREE.Euler();
  const p = new THREE.Vector3();
  const s = new THREE.Vector3();
  const c = new THREE.Color();
  const tones = ["#8a8077", "#6f665e", "#a39888", "#5c544d", "#9a8a78"];
  for (const geo of variants) {
    const mesh = new THREE.InstancedMesh(geo, material, per);
    for (let i = 0; i < per; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = inner + (outer - inner) * (0.5 + (Math.random() + Math.random() - 1) * 0.5);
      p.set(Math.cos(a) * r, (Math.random() - 0.5) * 7 * Math.random(), Math.sin(a) * r);
      const size = Math.pow(Math.random(), 4) * 2.6 + 0.15;
      s.set(size * (0.7 + Math.random() * 0.6), size * (0.6 + Math.random() * 0.5), size * (0.7 + Math.random() * 0.6));
      q.setFromEuler(e.set(Math.random() * 6, Math.random() * 6, Math.random() * 6));
      m.compose(p, q, s);
      mesh.setMatrixAt(i, m);
      mesh.setColorAt(i, c.set(tones[Math.random() * tones.length | 0]));
    }
    mesh.instanceMatrix.needsUpdate = true;
    group.add(mesh);
  }
  return {
    group,
    update(t2) {
      group.rotation.y = t2 * 6e-3;
    }
  };
}

function createWarp({ count = 900 }) {
  const pos = new Float32Array(count * 2 * 3);
  const end = new Float32Array(count * 2);
  const seed = new Float32Array(count * 2);
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 3 + Math.pow(Math.random(), 0.6) * 40;
    const z = -Math.random() * 200;
    const sd = Math.random();
    for (let k = 0; k < 2; k++) {
      const j = i * 2 + k;
      pos.set([Math.cos(a) * r, Math.sin(a) * r, z], j * 3);
      end[j] = k;
      seed[j] = sd;
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  geo.setAttribute("aEnd", new THREE.BufferAttribute(end, 1));
  geo.setAttribute("aSeed", new THREE.BufferAttribute(seed, 1));
  const material = new THREE.ShaderMaterial({
    uniforms: { uOffset: { value: 0 }, uLen: { value: 1 }, uIntensity: { value: 0 } },
    vertexShader: (
      /* glsl */
      `
      attribute float aEnd;
      attribute float aSeed;
      uniform float uOffset;
      uniform float uLen;
      varying float vA;
      void main() {
        vec3 p = position;
        p.z = mod(p.z + uOffset * (0.6 + aSeed * 0.8), 200.0) - 200.0;
        p.z -= aEnd * uLen * (0.5 + aSeed);
        vA = (1.0 - aEnd) * smoothstep(-200.0, -120.0, p.z) * smoothstep(0.0, -12.0, p.z);
        gl_Position = projectionMatrix * vec4(p, 1.0);
      }`
    ),
    fragmentShader: (
      /* glsl */
      `
      uniform float uIntensity;
      varying float vA;
      void main() { gl_FragColor = vec4(vec3(0.75, 0.85, 1.0) * vA * uIntensity, 1.0); }`
    ),
    transparent: true,
    depthWrite: false,
    depthTest: false,
    blending: THREE.AdditiveBlending
  });
  const lines = new THREE.LineSegments(geo, material);
  lines.frustumCulled = false;
  lines.renderOrder = 10;
  return {
    object: lines,
    // `pace` is scale-free: camera speed divided by distance to what it is looking at,
    // so the streaks respond the same whether crossing a galaxy or a planet's orbit.
    update(dt, pace) {
      const speed = pace * 90;
      const k = THREE.MathUtils.clamp((speed - 25) / 160, 0, 1);
      const u = material.uniforms;
      u.uIntensity.value += (k * 1.4 - u.uIntensity.value) * 0.08;
      u.uLen.value = 1 + Math.min(speed, 400) * 0.12;
      u.uOffset.value += Math.min(speed, 400) * dt * 0.8;
    }
  };
}

function tail({ count, color, spread, curve, speed, size, intensity, pr: pr2 }) {
  const t2 = new Float32Array(count);
  const off = new Float32Array(count * 2);
  const seed = new Float32Array(count);
  const gauss2 = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
  for (let i = 0; i < count; i++) {
    t2[i] = Math.random();
    off.set([gauss2(), gauss2()], i * 2);
    seed[i] = Math.random();
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(count * 3), 3));
  geo.setAttribute("aT", new THREE.BufferAttribute(t2, 1));
  geo.setAttribute("aOff", new THREE.BufferAttribute(off, 2));
  geo.setAttribute("aSeed", new THREE.BufferAttribute(seed, 1));
  const material = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uLen: { value: 8 },
      uSpread: { value: spread },
      uCurve: { value: curve },
      uSpeed: { value: speed },
      uSize: { value: size },
      uPR: { value: pr2 },
      uColor: { value: new THREE.Color(color) },
      uIntensity: { value: intensity }
    },
    vertexShader: (
      /* glsl */
      `
      attribute float aT; attribute vec2 aOff; attribute float aSeed;
      uniform float uTime, uLen, uSpread, uCurve, uSpeed, uSize, uPR;
      varying float vA;
      void main() {
        float z = fract(aT + uTime * uSpeed * (0.6 + aSeed * 0.8));
        vec3 p = vec3(aOff * uSpread * (0.06 + z), z * uLen);
        p.x += uCurve * z * z * uLen;
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = min(uSize * uPR * (1.0 - z * 0.4) / -mv.z, 14.0 * uPR);
        vA = pow(1.0 - z, 1.6) * smoothstep(0.0, 0.02, z);
      }`
    ),
    fragmentShader: (
      /* glsl */
      `
      uniform vec3 uColor; uniform float uIntensity; varying float vA;
      void main() {
        float d = length(gl_PointCoord - 0.5);
        float s = pow(max(1.0 - d * 2.0, 0.0), 2.0);
        gl_FragColor = vec4(uColor * s * vA * uIntensity, 1.0);
      }`
    ),
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  const p = new THREE.Points(geo, material);
  p.frustumCulled = false;
  return p;
}

    const r = a * (1 - e * e) / (1 + e * Math.cos(th));
    pts.push(new THREE.Vector3(Math.cos(th) * r, 0, Math.sin(th) * r));

  nucleus.scale.setScalar(0.05);
  head.add(nucleus);
  const coma = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTexture(),
    color: new THREE.Color("#c9f2ff").multiplyScalar(1.6),
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending

  const dust2 = tail({ count: 7e3, color: "#ffe6bd", spread: 0.7, curve: 0.22, speed: 0.06, size: 30, intensity: 0.75, pr: pr2 });
  tails.add(ion, dust2);
  const headWorld = new THREE.Vector3();
  const sunWorld = new THREE.Vector3();
  const away = new THREE.Vector3();
  const target = new THREE.Vector3();
  const up = new THREE.Vector3(0, 1, 0);
  const side = new THREE.Vector3();

    object: orbit,
    update(t2) {
      const th = theta0 + t2 * 35e-4;
      const r = a * (1 - e * e) / (1 + e * Math.cos(th));

      outPos.copy(headWorld).addScaledVector(side, 8.5).addScaledVector(away, 2).addScaledVector(up, 2.2);

  };

var introFrom = GALAXY.clone().add(V(18e3, 18e3, 95e3));
var frustum = new THREE.Frustum();
var projView = new THREE.Matrix4();
var holeSphere = new THREE.Sphere(WORLD.hole, 60);
var t = scrollTarget();
var intro = 0;
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = clock.elapsedTime;
  const inTour = t > TOUR.start && t < TOUR.end;
  const K = inTour ? 7 : 11;
  tVel += ((scrollTarget() - t) * K - tVel * 2 * Math.sqrt(K)) * dt;
  t += tVel * dt;
  intro = Math.min(1, intro + dt * 0.3);
  const ie = 1 - Math.pow(1 - intro, 4);
  galaxy.update(time, camera.position.distanceTo(WORLD.galaxy));
  const atHome = camera.position.distanceTo(WORLD.solar) < 170;
  const nearLocal = camera.position.distanceTo(LOCAL) < 1400;
  nebula.group.visible = pulsar.group.visible = solar.group.visible = ringNebula.group.visible = nearLocal;
  sun.group.visible = asteroids.group.visible = planet.group.visible = !atHome && nearLocal;
  andromeda.update(time * 0.6);
  solar.update(time, camera);
  const u = pathParam(toPath(t));
  posCurve.getPoint(u, camPos);
  lookCurve.getPoint(u, lookAt);
  const touring = t > TOUR.start && t < TOUR.end;
  if (touring) tourPose(t, camPos, lookAt);
  cinematic(dt, time, camPos, lookAt, touring);
  camPos.lerp(introFrom, 1 - ie);
  camera.position.copy(camPos);
  camera.lookAt(lookAt);
  mouse.sx += (mouse.x - mouse.sx) * 0.04;
  mouse.sy += (mouse.y - mouse.sy) * 0.04;
  camera.rotateY(-mouse.sx * 0.045);
  camera.rotateX(mouse.sy * 0.03);
  camera.updateMatrixWorld();
  velocity.subVectors(camPos, prevPos).divideScalar(Math.max(dt, 1e-4));
  if (!hasPrev) velocity.set(0, 0, 0);
  const pace = velocity.length() / Math.max(camPos.distanceTo(lookAt), 1);
  prevPos.copy(camPos);
  hasPrev = true;
  warp.update(dt, intro < 1 || touring ? 0 : pace);
  shootingStars.update(dt, intro >= 1 && pace < 0.08);
  const rushTarget = intro < 1 || touring ? 0 : clamp((pace - 0.15) / 1.2, 0, 1);
  rush += (rushTarget - rush) * (1 - Math.exp(-dt * (rushTarget > rush ? 4 : 1.6)));
  const yaw = Math.atan2(lookAt.x - camPos.x, lookAt.z - camPos.z);
  const yawRate = prevYaw === null ? 0 : Math.atan2(Math.sin(yaw - prevYaw), Math.cos(yaw - prevYaw)) / Math.max(dt, 1e-4);
  prevYaw = yaw;
  bank += (clamp(-yawRate * 0.08, -0.08, 0.08) - bank) * (1 - Math.exp(-dt * 1.5));
  camera.rotateZ(bank);
  camera.fov = BASE_FOV + rush * 7;
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld();
  finish.uniforms.uRush.value = rush;
  ambient.setRush(rush);
  sky.update(time, smooth(clamp((4200 - camera.position.distanceTo(LOCAL)) / 2400, 0, 1)));
  cosmicWeb.update(time);
  clusters.update(time);
  magellanic.update(time);
  antennae.update(dt, time, camera);
  quasar.update(time, camera);
  ringNebula.update(time);
  dustLanes.update(camera.position.y - GALAXY.y);
  dust.update(time, camera, atHome ? 0.12 : 1);
  updateFlare();
  pulsar.update(time, camera);
  nebula.update(time);
  sun.update(time, camera);
  asteroids.update(time);
  planet.update(time);
  projView.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  frustum.setFromProjectionMatrix(projView);
  const holeDist = camPos.distanceTo(WORLD.hole);
  holePass.enabled = holeDist < 8e3 && frustum.intersectsSphere(holeSphere);
  if (holePass.enabled) {
    const hu = holePass.uniforms;
    hu.uFade.value = 1;
    hu.uTime.value = time;
    hu.uCam.value.copy(camera.position);
    hu.uInvProj.value.copy(camera.projectionMatrixInverse);
    hu.uCamWorld.value.copy(camera.matrixWorld);
    hu.uViewProj.value.copy(projView);
  }
  finish.uniforms.uTime.value = time;
  applyGrade(toPath(t));
  updateUI(t);
  updateTourBar(t);
  updateSimBar(t);
  composer.render();
}
function jumpFromHash() {
  const m = location.hash.match(/t=([\d.]+)/);
  if (m) jumpTo(parseFloat(m[1]));
}
function jumpTo(fraction) {
  const v = clamp(fraction, 0, 1);
  const max = document.documentElement.scrollHeight - window.innerHeight;
  document.documentElement.style.scrollBehavior = "auto";
  window.scrollTo(0, v * max);
  t = v;
  tVel = 0;
  hasPrev = false;
  intro = 1;
}
jumpFromHash();
window.addEventListener("hashchange", jumpFromHash);
frame();
requestAnimationFrame(() => {
  $("#loader").classList.add("done");
  document.body.classList.add("ready");
});
  </script>
</body>
</html>
